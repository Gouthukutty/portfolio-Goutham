name: Goutham Portfolio CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # 1. Validate Portfolio
  # =========================
  validate:
    name: Validate Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f Dockerfile
          test -f docker-compose.yml

  # =========================
  # 2. Docker Build and Push
  # =========================
  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs:
      - validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push portfolio image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/goutham-portfolio:latest

  # =========================
  # 3. Deploy to EC2
  # =========================
  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - docker-build-push

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/goutham-portfolio
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker ps --filter "name=goutham-portfolio"
